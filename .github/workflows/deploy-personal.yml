name: Deploy Personal

on:
  push:
    branches: [for_personal]
  workflow_dispatch:

concurrency:
  group: deploy-personal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: personal
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: |
            OCR_API_KEY
          script: |
            cd ~/marcia-recipe
            git fetch origin for_personal
            git checkout for_personal
            git reset --hard origin/for_personal
            # Inject the Mistral OCR key into .env (app expects MISTRAL_API_KEY)
            if [ -n "$OCR_API_KEY" ]; then
              sed -i '/^MISTRAL_API_KEY=/d' .env
              echo "MISTRAL_API_KEY=$OCR_API_KEY" >> .env
            fi
            sed -i '/^AUTH_URL=/d; /^NEXTAUTH_URL=/d' .env
            APP_ORIGIN_VALUE="$(grep '^APP_ORIGIN=' .env | cut -d= -f2-)"
            printf 'AUTH_URL=%s\n' "$APP_ORIGIN_VALUE" >> .env
            docker compose build
            docker compose up -d
            sleep 10
            curl -sf http://127.0.0.1:3000/api/health || (echo "HEALTH CHECK FAILED" && exit 1)
            echo "Personal deploy complete"
