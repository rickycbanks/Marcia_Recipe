name: Deploy Demo

on:
  push:
    branches: [for_demo]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: |
            OCR_API_KEY
          script: |
            set -euo pipefail
            cd ~/marcia-recipe-demo
            git fetch origin for_demo
            git checkout for_demo
            git reset --hard origin/for_demo
            # Inject the Mistral OCR key into .env (app expects MISTRAL_API_KEY)
            if [ -n "$OCR_API_KEY" ]; then
              sed -i '/^MISTRAL_API_KEY=/d' .env
              echo "MISTRAL_API_KEY=$OCR_API_KEY" >> .env
            fi
            sed -i '/^AUTH_URL=/d; /^NEXTAUTH_URL=/d' .env
            APP_ORIGIN_VALUE="$(grep '^APP_ORIGIN=' .env | cut -d= -f2-)"
            printf 'AUTH_URL=%s\n' "$APP_ORIGIN_VALUE" >> .env

            # Build BOTH images explicitly.  The seed-restore service is gated
            # behind the `tools` profile, so a bare `docker compose build`
            # would skip it; and the app image must be the slim `runner` target
            # (not the Dockerfile's final `tools` stage, which has no CMD and
            # would make the container exit immediately).
            docker compose build app seed-restore

            docker compose up -d

            wait_for_health() {
              local url="$1"
              for _ in $(seq 1 24); do
                if curl -sf "$url" >/dev/null 2>&1; then
                  return 0
                fi
                sleep 5
              done
              return 1
            }

            if ! wait_for_health http://127.0.0.1:3001/api/health; then
              echo "HEALTH CHECK FAILED (/api/health)"
              docker compose ps
              docker compose logs --tail=200 app
              exit 1
            fi

            # Reset demo data from the immutable repo-managed seed baked into
            # the seed-restore tools stage.  Restore fails loud on any
            # recipe/media inconsistency.
            docker compose run --rm --no-deps seed-restore \
              npm run cli:restore-demo-seed -- \
              --output-dir /app/scripts/demo-seed --force --data-root /data/demo

            # Confirm the app is alive AND ready (DATA_ROOT restored and
            # writable by the app).
            if ! wait_for_health http://127.0.0.1:3001/api/health; then
              echo "HEALTH CHECK FAILED AFTER RESET (/api/health)"
              docker compose ps
              docker compose logs --tail=200 app
              exit 1
            fi
            if ! wait_for_health http://127.0.0.1:3001/api/ready; then
              echo "READY CHECK FAILED AFTER RESET (/api/ready)"
              docker compose ps
              docker compose logs --tail=200 app
              exit 1
            fi
            echo "Demo deploy + reset complete"
