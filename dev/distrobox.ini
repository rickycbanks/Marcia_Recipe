# Portable development environment for Marcia Recipe.
#
# Recreate on any machine with:  distrobox-assemble create --file dev/distrobox.ini
# Enter with:                     distrobox enter marcia-dev
# Full guide: docs/DEV-ENV.md
#
# The container holds only the toolchain. The project, node_modules, .env, and
# data/ all live in the bind-mounted home and persist on the host, so the
# container itself is disposable.

[marcia-dev]
# Fedora (glibc). sharp ships prebuilt linux-x64 binaries, so no compiler is
# needed. The Fedora `nodejs` package provides Node.js 22 + npm, which satisfies
# the project's `engines.node >=22`.
image=registry.fedoraproject.org/fedora:42
pull=true
replace=true

# Node.js 22 (bundles npm) + everyday CLI tools. No build toolchain required.
additional_packages="nodejs git ca-certificates curl openssl procps-ng less nano which findutils gnupg2"

# Publish port 3000 so the dev server is reachable from the host browser at
# http://localhost:3000 (Next.js binds all interfaces by default, so plain
# `npm run dev` works). `--ipc=host` keeps Playwright/Chromium shared memory
# working. For host-namespace networking instead, use `--network=host`.
additional_flags="-p 3000:3000 --ipc=host"

# Idempotent quality-of-life, run as the container user (same UID as the host).
init_hooks="npm config set fund false; npm config set audit false; git config --global init.defaultBranch main"
