services:
  app:
    build: .
    image: marcia-recipe:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATA_ROOT: /data/marcia-recipe
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      AUTH_URL: ${AUTH_URL:-${APP_ORIGIN:-http://localhost:3000}}
      NEXTAUTH_URL: ${AUTH_URL:-${APP_ORIGIN:-http://localhost:3000}}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      PRIVATE_CONFIG_KEYRING: ${PRIVATE_CONFIG_KEYRING:-}
    volumes:
      - marcia_recipe_data:/data/marcia-recipe
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  marcia_recipe_data:
