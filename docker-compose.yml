services:
  app:
    build:
      context: .
      target: runner
    image: marcia-recipe:demo
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATA_ROOT: /data/demo
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      AUTH_URL: ${AUTH_URL:-${APP_ORIGIN:-http://localhost:3000}}
      NEXTAUTH_URL: ${AUTH_URL:-${APP_ORIGIN:-http://localhost:3000}}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      PRIVATE_CONFIG_KEYRING: ${PRIVATE_CONFIG_KEYRING:-}
    volumes:
      - marcia_demo_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # seed-restore — never started by `docker compose up`.  The reset/deploy
  # workflows invoke it explicitly with `docker compose run --rm seed-restore
  # npm run cli:restore-demo-seed -- --output-dir /app/scripts/demo-seed --force`.
  # It shares the demo's data volume so its atomic root swap takes effect for
  # the live `app` container.  It runs as the same UID as the runner `app`
  # (1001) so the restored DATA_ROOT stays readable/writable by the app, and
  # gets the env the restore engine truly requires (getEnv() rejects
  # production without AUTH_SECRET).
  # ---------------------------------------------------------------------------
  seed-restore:
    build:
      context: .
      target: tools
    image: marcia-recipe:demo-tools
    user: "1001:1001"
    environment:
      NODE_ENV: production
      HOME: /tmp
      DATA_ROOT: /data/demo
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
    volumes:
      - marcia_demo_data:/data
    profiles:
      - tools

volumes:
  marcia_demo_data: